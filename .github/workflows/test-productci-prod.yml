name: Product API - Production CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/productdb
      MONGO_HOST_PORT: 27018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: docker build --tag product-api:local .
      - name: Verify Compose service healthchecks
        run: docker compose up --no-build --detach --wait
      - name: Stop Compose test services
        if: always()
        run: docker compose down --volumes
