name: Product API - Production CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_PORT: 5433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: docker build --tag product-api:local .
      - name: Verify Compose service healthchecks
        run: docker compose up --no-build --detach --wait
      - name: Stop Compose test services
        if: always()
        run: docker compose down --volumes
